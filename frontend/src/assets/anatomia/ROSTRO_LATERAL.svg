  <path id="papada_lateral" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 175 298 C 188 292 200 278 208 262
       C 210 270 210 285 210 298
       C 210 310 208 318 205 322
       C 196 322 185 318 175 312
       C 170 308 170 302 175 298 Z"/>

  <!-- CUELLO LATERAL -->
  <path id="cuello_lateral" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 205 315 C 218 312 232 312 242 318
       C 248 340 252 368 250 392
       C 242 408 228 418 215 420
       C 202 418 192 408 190 395
       C 188 370 192 340 205 315 Z"/>
</svg>
