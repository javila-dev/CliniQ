  <path id="angulo_mandibular" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 162 192 C 175 190 190 188 202 192
       C 208 212 210 238 208 260
       C 200 278 188 292 175 298
       C 160 292 148 275 146 255
       C 144 232 150 210 162 192 Z"/>

