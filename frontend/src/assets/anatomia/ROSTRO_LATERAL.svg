<svg viewBox="0 0 360 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .zona-anatomica { cursor: pointer; transition: fill 0.15s; }
      .zona-anatomica:hover { fill: rgba(99,102,241,0.15); }
      .contorno { fill: none; pointer-events: none; }
    </style>
  </defs>

  <!-- ── Silueta base lateral (decorativa) ──────────────────────────── -->
  <!-- Cráneo / cabeza -->
  <path class="contorno" stroke="#94a3b8" stroke-width="2"
    d="M 210 38 C 255 38 308 58 322 108 C 336 155 328 210 308 248
       C 290 280 258 302 235 312 C 225 315 215 316 208 314
       C 198 302 192 285 190 265
       C 185 240 190 210 198 185
       C 170 170 152 148 148 120
       C 144 92 162 58 210 38 Z"/>
  <!-- Oreja -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.5"
    d="M 148 160 C 128 165 115 180 118 200 C 121 222 138 238 155 234
       C 160 230 162 222 160 212
       C 155 200 152 185 155 172 Z"/>
  <!-- Detalle interior oreja -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1"
    d="M 132 185 C 136 178 145 175 152 178 C 150 192 144 205 138 210"/>
  <!-- Nariz (perfil) -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.3"
    d="M 308 178 C 316 192 325 210 328 228 C 330 240 326 252 318 258
       C 308 264 295 262 285 268"/>
  <!-- Boca (perfil) -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.2"
    d="M 268 298 C 278 292 292 292 300 298 C 296 308 285 316 272 312 Z"/>
  <!-- Ojo (perfil) -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.2"
    d="M 240 160 C 256 152 278 152 292 162 C 285 172 268 175 252 170 Z"/>
  <circle class="contorno" stroke="#94a3b8" stroke-width="1" cx="272" cy="164" r="6"/>
  <!-- Ceja -->
  <path class="contorno" stroke="#94a3b8" stroke-width="2"
    d="M 235 145 C 252 138 275 138 295 148"/>
  <!-- Cuello -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.8"
    d="M 208 314 C 205 338 208 368 215 390 C 225 415 240 425 255 430
       M 230 315 C 235 340 240 370 245 390"/>

  <!-- ── ZONAS CLICKEABLES ──────────────────────────────────────────── -->

  <!-- SIEN -->
  <path id="sien" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 148 100 C 162 72 185 50 210 42
       C 238 50 265 65 285 90
       C 268 88 245 90 228 102
       C 210 112 185 125 165 135
       C 158 120 152 110 148 100 Z"/>

  <!-- TEMPORAL (frente lateral) -->
  <path id="temporal" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 215 42 C 248 42 282 60 300 88
       C 288 90 268 88 248 98
       C 232 106 215 118 200 130
       C 185 125 168 115 155 105
       C 175 78 195 52 215 42 Z"/>

  <!-- PREAURICULAR (mejilla alta / zona parotídea) -->
  <path id="preauricular" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 148 120 C 155 110 168 108 178 112
       C 185 128 190 148 190 165
       C 185 180 175 190 162 192
       C 152 182 145 165 146 148
       C 146 138 147 128 148 120 Z"/>

