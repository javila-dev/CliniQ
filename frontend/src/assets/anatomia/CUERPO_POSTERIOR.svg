  <path id="espalda_sup" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
    d="M 108 116 Q 155 110 200 116 Q 245 110 292 116
       L 290 185 Q 200 196 110 185 Z"/>

  <!-- ESPALDA MEDIA (omóplatos) -->
  <path id="espalda_med" class="zona-anatomica" fill="transparent" stroke="#cbd5e1" stroke-width="1.5"
