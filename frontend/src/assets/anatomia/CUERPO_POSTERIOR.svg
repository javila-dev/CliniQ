       C 318 122 338 138 348 162 C 355 182 350 205 338 218
       C 330 228 315 232 305 228
       L 300 340 C 300 360 295 375 290 390
       L 270 400 L 265 340 L 135 340 L 130 400 L 110 390
       C 105 375 100 360 100 340 L 95 228
       C 85 232 70 228 62 218 C 50 205 45 182 52 162
       C 62 138 82 122 100 116 Z"/>
  <!-- Brazos posteriores -->
  <path class="contorno" stroke="#94a3b8" stroke-width="1.5"
    d="M 62 218 C 52 235 46 260 50 285 C 54 310 65 330 78 340 L 95 335"/>
  <path class="contorno" stroke="#94a3b8" stroke-width="1.5"
    d="M 338 218 C 348 235 354 260 350 285 C 346 310 335 330 322 340 L 305 335"/>
