  <path class="contorno" stroke="#94a3b8" stroke-width="1.8"
    d="M 178 90 L 176 116 Q 200 122 224 116 L 222 90"/>
  <!-- Hombros y torso -->
  <path class="contorno" stroke="#94a3b8" stroke-width="2"
